name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build all apps
        run: |
          shopt -s nullglob
          mkdir -p _site
          for dir in apps/*/; do
            app=$(basename "$dir")
            echo "::group::build $app"
            (cd "$dir" && npm ci && npm run build)
            cp -r "$dir/dist" "_site/$app"
            echo "::endgroup::"
          done

      - name: Generate index page
        run: node scripts/generate-index.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
