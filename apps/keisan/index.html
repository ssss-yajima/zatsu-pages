<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fdfdf8" />
    <title>けいさん れんしゅう</title>
  </head>
  <body>
    <div id="app">
      <!-- ============ ホーム ============ -->
      <section id="s-home" class="screen on">
        <p class="eyebrow">1ねんせい さんすう</p>
        <h1 class="title"><u>けいさん</u><br />れんしゅう</h1>
        <p class="lead">20もん こたえて タイムを はかろう</p>
        <div id="cards"></div>
        <button type="button" class="big-btn ghost" id="btn-records">きろくを みる</button>
        <div class="home-foot">
          <button type="button" class="mini" id="btn-sound">おと: あり</button>
          <button type="button" class="mini warn" id="btn-clear">きろくを けす</button>
        </div>
      </section>

      <!-- ============ カウントダウン ============ -->
      <section id="s-count" class="screen">
        <p id="count-label">よーい</p>
        <div id="count-num">3</div>
      </section>

      <!-- ============ プレイ ============ -->
      <section id="s-play" class="screen">
        <div class="bar">
          <button type="button" class="quit" id="btn-quit" aria-label="やめる">✕</button>
          <button type="button" class="sound" id="btn-sound2" aria-label="おと">🔊</button>
          <div class="clock"><b id="clock">0.0</b><span>びょう</span></div>
        </div>
        <div class="stamps" id="stamps"></div>
        <div class="qwrap">
          <div id="qcard">
            <svg id="maru" viewBox="0 0 240 150" preserveAspectRatio="none" aria-hidden="true">
              <path
                d="M122 10 C176 8 232 40 231 76 C230 112 176 142 118 141 C58 140 9 110 10 74 C11 38 62 12 122 10"
              />
            </svg>
            <span class="n" id="q-a">9</span>
            <span class="op" id="q-op">＋</span>
            <span class="n" id="q-b">2</span>
            <span class="eq">＝</span>
            <span class="ans" id="q-ans">?</span>
          </div>
        </div>
        <div id="pad"></div>
        <div id="quit-dialog" class="overlay" hidden>
          <div class="overlay-box sheet">
            <p>とちゅうで やめる？</p>
            <button type="button" class="big-btn" id="btn-quit-no">つづける</button>
            <button type="button" class="big-btn ghost" id="btn-quit-yes">やめる</button>
          </div>
        </div>
      </section>

      <!-- ============ きろく（ランキングとりれき） ============ -->
      <section id="s-records" class="screen">
        <div class="bar">
          <button type="button" class="quit" id="btn-records-back" aria-label="もどる">←</button>
          <h2 class="records-title">きろく</h2>
        </div>
        <div class="rec-tabs" id="rec-tabs"></div>
        <div class="sheet rank">
          <h3>はやい じゅんばん</h3>
          <ol id="rec-rank"></ol>
        </div>
        <div class="sheet rank">
          <h3>さいきんの きろく</h3>
          <ol id="rec-history"></ol>
        </div>
      </section>

      <!-- ============ けっか ============ -->
      <section id="s-result" class="screen">
        <div id="badge" hidden></div>
        <div class="sheet result-time">
          <span id="hanamaru" class="hanamaru" hidden>💮</span>
          <small>かかった じかん</small>
          <b id="r-time">0.0</b>
          <em id="r-note"></em>
        </div>
        <div class="sheet rank">
          <h3>はやい じゅんばん</h3>
          <ol id="r-rank"></ol>
        </div>
        <div class="btn-row">
          <button type="button" class="big-btn" id="btn-again">もういっかい</button>
          <button type="button" class="big-btn ghost" id="btn-home">もんだいを えらぶ</button>
        </div>
      </section>
    </div>
    <canvas id="confetti" hidden></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
